# ─────────────────────────────────────────────────────────────
#  matugen  ·  ~/.config/matugen/config.toml
#  Run `~/.config/hypr/scripts/wallpaper.sh [image|dir]` to apply
# ─────────────────────────────────────────────────────────────

[config]
mode = "dark"                # the wallpaper script also passes -m dark explicitly

# matugen sets the wallpaper itself through awww, so the script only calls matugen
[config.wallpaper]
set = true
command = "awww"
arguments = [
    "img",
    "--transition-type", "grow",
    "--transition-pos", "0.5,0.5",
    "--transition-duration", "1.4",
    "--transition-fps", "60",
]

# Extra colours, harmonised with the wallpaper's source colour.
# They show up as {{colors.red.default.hex}}, {{colors.on_red.default.hex}} ...
# and as @red / @green / ... in the generated CSS files. Used for the terminal ANSI palette,
# battery/error states, etc.
[config.custom_colors]
red     = "#e5484d"
green   = "#46a758"
yellow  = "#f5c451"
blue    = "#3e8bff"
magenta = "#c15fd8"
cyan    = "#2bb6c4"

# ── Hyprland ────────────────────────────────────────────────
[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook   = "timeout 3 hyprctl reload"

# ── Waybar ──────────────────────────────────────────────────
[templates.waybar]
input_path  = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook   = "pkill -SIGUSR2 waybar || true"

# ── SwayNC (notifications + control centre) ─────────────────
[templates.swaync]
input_path  = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/swaync/colors.css"
post_hook   = "timeout 3 swaync-client --reload-css >/dev/null 2>&1 || true"

# ── Eww (control panel) ─────────────────────────────────────
[templates.eww]
input_path  = "~/.config/matugen/templates/eww-colors.scss"
output_path = "~/.config/eww/colors.scss"
# eww is restarted by hypr/scripts/wallpaper.sh (matugen/scripts/reload-eww.sh), not from here

# ── Alacritty ───────────────────────────────────────────────
[templates.alacritty]
input_path  = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.config/alacritty/colors.toml"

# ── Rofi ────────────────────────────────────────────────────
[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

# ── GTK 3 / 4 (use adw-gtk3 + these named colours) ──────────
[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"
post_hook   = "bash ~/.config/matugen/scripts/gtk-reload.sh >/dev/null 2>&1 &"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

# ── Qt (qt5ct / qt6ct palette + Kvantum theme) ──────────────
[templates.qt5ct]
input_path  = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path  = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.kvantum_kvconfig]
input_path  = "~/.config/matugen/templates/kvantum-colors.kvconfig"
output_path = "~/.config/Kvantum/matugen/matugen.kvconfig"

[templates.kvantum_svg]
input_path  = "~/.config/matugen/templates/kvantum-colors.svg"
output_path = "~/.config/Kvantum/matugen/matugen.svg"
